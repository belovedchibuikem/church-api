name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: family_house_connect_testing
          MYSQL_USER: family_house_connect_ci
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_DEBUG: 'false'
      BCRYPT_ROUNDS: '4'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: family_house_connect_testing
      DB_USERNAME: family_house_connect_ci
      DB_PASSWORD: ci-database-password
      DB_ENGINE: InnoDB
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      REDIS_CACHE_DB: '1'
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
      NIGHTWATCH_ENABLED: 'false'
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_PROCESS_TIMEOUT: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, mbstring, pdo_mysql, redis, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Clear cached configuration
        run: php artisan config:clear --ansi

      - name: Validate migrations on MySQL
        run: php artisan migrate:fresh --force --ansi

      - name: Run PHPUnit suite
        run: php artisan test --compact

      - name: Format PHP with Pint
        run: vendor/bin/pint --format agent

      - name: Reject uncommitted formatting changes
        run: git diff --exit-code
